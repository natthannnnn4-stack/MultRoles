
name: Build MultRoles

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x

      - name: Restore
        run: dotnet restore MultRoles.csproj

      - name: Build
        run: dotnet build MultRoles.csproj --configuration Release --no-restore

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: MultRoles-IL2CPP
          path: bin/Release/net6.0/MultRoles.dll
          if-no-files-found: error
          retention-days: 14
